version: "3.9"

services:
  app:
    build: .
    ports:
      - "6800:6800"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # CTranslate2 (faster-whisper): 0 = use all cores
      - CT2_INTER_THREADS=0
      - CT2_INTRA_THREADS=0
      # OMP/BLAS/Numba: leave unset so each library auto-detects core count
    depends_on:
      - ollama
    restart: unless-stopped
    # cpus/mem_limit work with plain `docker compose up` (no Swarm needed)
    cpus: '4.0'
    mem_limit: 8g
    mem_reservation: 4g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama_models:/root/.ollama
    ports:
      - "11435:11434"
    restart: unless-stopped
    cpus: '2.0'
    mem_limit: 4g
    mem_reservation: 2g

  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ./ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: >
      sh -c "sleep 5 && ollama pull llama3.2:1b"
    restart: "no"