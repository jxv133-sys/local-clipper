version: "3.9"

services:
  app:
    build: .
    ports:
      - "6800:6800"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    cpus: '12.0'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama_models:/root/.ollama
    ports:
      - "11435:11434"
    restart: unless-stopped
    cpus: '8.0'

  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ./ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: >
      sh -c "sleep 5 && ollama pull llama3.2:1b"
    restart: "no"